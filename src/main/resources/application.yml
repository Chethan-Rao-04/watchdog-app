# minimal config for the mail details.

spring:
  application:
    name: watchdog
  mail:
    host: 
    port: 
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


watchdog:
  check-interval: 600000       # Initial value
  summary-time: 0 00 10 * * MON  # Initial value
  email-recipients: chethanrao82@gmail.com
logging:
  level:
    com.charite.watchdog.service: DEBUG