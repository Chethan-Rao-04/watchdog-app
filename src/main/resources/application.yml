spring:
  application:
    name: watchdog
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:addtheusername}
    password: ${MAIL_PASSWORD:addthepwd} # Use env vars in production
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

watchdog:
  check-interval: 30000  # 30 seconds for testing
  email:
    recipients: ${EMAIL_RECIPIENTS:addtheusername}
    sender: ${EMAIL_SENDER:addtheusername}


logging:
  level:
    com.charite.watchdog: DEBUG  # Show DEBUG, INFO, WARN, ERROR from your package
